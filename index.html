<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Majestic Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      /* Запрещаем нативный жест масштабирования браузера (pinch-to-zoom) на
         самой карте — без этого iOS/Android параллельно с зумом Leaflet ещё
         и масштабируют весь DOM нативно, из-за чего квадраты визуально
         "распухали" при сведении/разведении пальцев. Зум остаётся полностью
         рабочим — его теперь обрабатывает только сам Leaflet (touchZoom). */
      touch-action: none;
      -ms-touch-action: none;
    }
    html, body {
      font-family: 'Golos Text', 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    }
    #map, .leaflet-container {
      font-family: 'Golos Text', 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    }
.leaflet-control-container { }
    .layer-switcher { background: rgba(18,18,18,.9); padding:6px; border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.35); }
    .layer-switcher button { border:0; border-radius:8px; padding:9px 12px; color:#ddd; background:transparent; cursor:pointer; font-size:14px; }
    .layer-switcher button:hover { background:#2b2b2b; }
    .layer-switcher button.active { background:#fff; color:#111; }

    .auth-widget {
      background: rgba(18,18,18,.9);
      padding: 8px 10px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
      color: #ddd;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 20px;
    }
    .auth-widget img { width: 28px; height: 28px; border-radius: 50%; display:block; }
    .auth-widget button {
      border: 0; border-radius: 8px; padding: 7px 10px;
      color: #ddd; background: #2b2b2b; cursor: pointer; font-size: 13px;
    }
    .auth-widget button:hover { background: #3a3a3a; }
    .auth-widget .gear-btn {
      width: 30px; height: 30px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }
    .admin-badge {
      background: #5865F2; color: #fff; border-radius: 6px;
      padding: 2px 6px; font-size: 11px; font-weight: 600;
    }
    /* Плашка "атака/защита в день" справа от ника — видна только тем, у кого
       есть роль лидера/зама с настроенным лимитом (attacksPerDay/defensesPerDay).
       Это отдельная плашка (со своим фоном), а не просто текст рядом с именем. */
    .combat-status-badge {
      display: flex; align-items: center; gap: 6px;
      background: #1c1c1e; border-radius: 8px; padding: 4px 8px;
      margin-left: 2px;
    }
    .combat-status-badge.hidden { display: none; }
    .combat-badge {
      display: flex; align-items: center; gap: 3px;
      font-size: 12px; font-weight: 700; color: #ddd; white-space: nowrap;
    }
    .combat-badge.attack { color: #ff8a8a; }
    .combat-badge.defense { color: #8ac8ff; }
    .combat-badge.hidden { display: none; }
    .combat-badge.full { color: #ff5252; }

    .map-square {
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,.5);
      box-sizing: border-box;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      /* Явно запрещаем любые CSS-переходы/трансформации на самом квадрате —
         это гарантирует, что он не "подрастает" визуально во время
         зума/пинча, независимо от отключённой zoomAnimation на карте. */
      transition: none !important;
      transform: none !important;
    }
    .map-square-label {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      max-width: none;
      white-space: nowrap;
      background: rgba(10,10,12,.85);
      color: #fff;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'Golos Text', 'Inter', system-ui, sans-serif;
      letter-spacing: .2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
      z-index: 5;
    }
    .map-square:hover .map-square-label {
      opacity: 1;
    }

    /* Общее меню внизу слева: кнопка "Квадрат" (только для админов) и
       "История сражений" (для всех). Flex-контейнер с transition на
       width/gap — при появлении/исчезновении кнопки (например, когда
       у пользователя появляются/пропадают права редактирования квадратов)
       меню плавно "растягивается" или "сжимается", а не дёргается скачком. */
    .bottom-left-menu {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      transition: gap .2s ease;
    }
    .bottom-left-menu button {
      border: 0; border-radius: 12px; padding: 10px 14px;
      color: #ddd; background: rgba(18,18,18,.9); cursor: pointer;
      font-size: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.35);
      white-space: nowrap; overflow: hidden;
      transition: background .15s ease, color .15s ease, box-shadow .15s ease,
                  max-width .2s ease, padding .2s ease, opacity .2s ease, transform .2s ease;
      max-width: 260px;
    }
    .bottom-left-menu button:hover { background: #2b2b2b; }
    .bottom-left-menu button.active {
      background: #5865F2; color: #fff;
      box-shadow: 0 4px 18px rgba(88,101,242,.55);
    }
    .bottom-left-menu button.active:hover { background: #4752c4; }
    .bottom-left-menu button.hidden-btn {
      max-width: 0; padding-left: 0; padding-right: 0; margin: 0;
      opacity: 0; transform: scale(.85);
      box-shadow: none; pointer-events: none;
    }

    .square-editor {
      display: flex;
      position: fixed;
      left: 50%; bottom: 24px;
      transform: translateX(-50%) translateY(16px) scale(.97);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 1000;
      background: linear-gradient(180deg, rgba(28,28,30,.97), rgba(18,18,20,.97));
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      padding: 0; border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0,0,0,.55);
      flex-direction: column;
      width: 240px;
      color: #ddd;
      font-size: 12px;
      transition: opacity .18s ease, transform .18s ease, visibility .18s;
    }
    .square-editor.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0) scale(1);
    }
    .square-editor-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .square-editor-title {
      font-size: 13px; font-weight: 600; color: #fff; letter-spacing: .2px;
    }
    .square-editor-close {
      border: 0; background: rgba(255,255,255,.06); color: #bbb;
      width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; line-height: 1; transition: background .15s, color .15s;
    }
    .square-editor-close:hover { background: rgba(255,255,255,.15); color: #fff; }
    .square-editor-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .square-editor-preview {
      display: flex; justify-content: center; align-items: center;
      height: 56px; border-radius: 10px;
      background-image:
        linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
        linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
        linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
      background-color: #1a1a1a;
      border: 1px solid rgba(255,255,255,.06);
    }
    .square-editor-row { display: flex; flex-direction: column; gap: 5px; }
    .square-editor-row label {
      color: #9a9a9a; font-size: 11px; text-transform: uppercase; letter-spacing: .4px;
      display: flex; justify-content: space-between;
    }
    .square-editor-row label span { color: #ddd; text-transform: none; letter-spacing: 0; font-weight: 600; }
    .square-editor-colors { display: flex; gap: 10px; }
    .square-editor-colors .square-editor-row { flex: 1; }
    .square-editor input[type="text"] {
      background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 9px;
      color: #eee; padding: 8px 10px; font-size: 13px; width: 100%;
      box-sizing: border-box; transition: border-color .15s ease;
    }
    .square-editor input[type="text"]:focus {
      outline: none; border-color: #5865F2;
    }
    .square-editor input[type="color"] {
      width: 100%; height: 34px; border: 1px solid #3a3a3c; border-radius: 9px;
      background: #1c1c1e; cursor: pointer; padding: 3px;
    }
    .square-editor input[type="range"] {
      width: 100%; accent-color: #5865F2; cursor: pointer;
    }
    .square-editor textarea {
      background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 9px;
      color: #eee; padding: 8px 10px; font-size: 13px; width: 100%;
      box-sizing: border-box; resize: vertical; min-height: 54px;
      font-family: inherit; transition: border-color .15s ease;
    }
    .square-editor textarea:focus { outline: none; border-color: #5865F2; }
    .square-editor select {
      background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 9px;
      color: #eee; padding: 8px 10px; font-size: 13px; width: 100%;
      box-sizing: border-box; cursor: pointer;
    }
    .square-editor-toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 9px;
      padding: 8px 10px;
    }
    .square-editor-toggle-label { font-size: 12px; color: #ddd; }
    .toggle-switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-slider {
      position: absolute; inset: 0; background: #3a3a3c; border-radius: 22px;
      cursor: pointer; transition: background .15s ease;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 16px; height: 16px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%;
      transition: transform .15s ease;
    }
    .toggle-switch input:checked + .toggle-slider { background: #5865F2; }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); }
    .square-editor-actions { display: flex; gap: 8px; padding: 4px 16px 16px; }
    .square-editor-actions button {
      flex: 1; border: 0; border-radius: 10px; padding: 9px 10px;
      color: #ddd; background: #2b2b2d; cursor: pointer; font-size: 13px;
      font-weight: 500; transition: background .15s ease, transform .1s ease;
    }
    .square-editor-actions button:hover { background: #38383a; }
    .square-editor-actions button:active { transform: scale(.96); }
    #squareSaveBtn { background: #3ba55d; color: #fff; }
    #squareSaveBtn:hover { background: #339152; }
    #squareDeleteBtn { background: #a83a3a; color: #fff; }
    #squareDeleteBtn:hover { background: #8f3131; }
    #squareDeleteBtn.hidden { display: none; }

    /* ---- Модальные окна (инфо о квадрате / панель администратора) ---- */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55);
      z-index: 1400; backdrop-filter: blur(2px);
    }
    .modal-backdrop.visible { display: block; }

    .info-modal {
      display: flex; flex-direction: column;
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(.96);
      opacity: 0; visibility: hidden; pointer-events: none;
      z-index: 1500; width: 300px; max-width: 90vw;
      background: linear-gradient(180deg, rgba(28,28,30,.98), rgba(18,18,20,.98));
      border: 1px solid rgba(255,255,255,.08); border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0,0,0,.6);
      color: #ddd;
      transition: opacity .18s ease, transform .18s ease, visibility .18s;
    }
    .info-modal.visible {
      opacity: 1; visibility: visible; pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .info-modal-header {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 14px 12px; border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .info-modal-icon {
      width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.5);
    }
    .info-modal-title { flex: 1; font-size: 14px; font-weight: 600; color: #fff; }
    .info-modal-body { padding: 14px; font-size: 13px; line-height: 1.5; }
    .info-modal-desc { margin: 0; color: #ccc; white-space: pre-wrap; }
    .info-modal-desc.empty { color: #777; font-style: italic; }
    .info-modal-footer { padding: 0 14px 14px; font-size: 11px; color: #888; text-align: right; }
    .info-modal-actions { padding: 0 14px 14px; display: flex; }
    .square-attack-btn {
      flex: 1; border: 0; border-radius: 10px; padding: 10px 10px;
      background: #a83a3a; color: #fff; cursor: pointer; font-size: 13px;
      font-weight: 600; letter-spacing: .2px;
      transition: background .15s ease, transform .1s ease;
    }
    .square-attack-btn:hover { background: #8f3131; }
    .square-attack-btn:active { transform: scale(.96); }
    .square-attack-btn.hidden { display: none; }
    .square-attack-btn.sent { background: #3a3a3c; cursor: default; }
    .square-attack-btn.blocked { background: #3a3a3c; cursor: not-allowed; color: #999; }
    .info-modal-faction {
      font-size: 11px; color: #9a9a9a; padding: 0 14px 8px; margin-top: -4px;
    }
    .square-info-error {
      margin: 0 14px 14px; padding: 8px 10px; border-radius: 8px;
      background: rgba(168,58,58,.15); border: 1px solid rgba(168,58,58,.4);
      color: #e07070; font-size: 11px; line-height: 1.4; display: none;
    }
    .square-info-error.visible { display: block; }

    .admin-panel { width: 380px; }
    .admin-panel-body { max-height: 60vh; overflow-y: auto; }
    .admin-section { margin-bottom: 18px; }
    .admin-section:last-child { margin-bottom: 0; }
    .admin-section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: .4px;
      color: #9a9a9a; margin-bottom: 8px;
    }
    .roles-list { display: flex; flex-direction: column; }
    .role-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.06); flex-wrap: wrap;
    }
    .role-row:last-child { border-bottom: 0; }
    .role-name-input {
      flex: 1; min-width: 90px; background: #1c1c1e; border: 1px solid #3a3a3c;
      border-radius: 8px; color: #eee; padding: 6px 8px; font-size: 12px;
    }
    .role-icon-input {
      width: 32px; flex-shrink: 0; text-align: center; background: #1c1c1e;
      border: 1px solid #3a3a3c; border-radius: 8px; color: #eee;
      padding: 6px 2px; font-size: 14px;
    }
    .role-color-input {
      width: 30px; height: 26px; padding: 2px; border-radius: 6px;
      border: 1px solid #3a3a3c; background: #1c1c1e; cursor: pointer; flex-shrink: 0;
    }
    .role-perm-toggle {
      display: flex; align-items: center; gap: 4px; font-size: 10px; color: #aaa;
      white-space: nowrap; cursor: pointer;
    }
    .role-delete-btn {
      border: 0; background: rgba(168,58,58,.15); color: #e07070;
      width: 24px; height: 24px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
    }
    .role-delete-btn:hover { background: rgba(168,58,58,.3); }
    .role-faction-tag {
      font-size: 10px; color: #888; min-width: 68px; white-space: nowrap;
    }
    .role-limit-group {
      display: flex; align-items: center; gap: 3px; font-size: 10px; color: #9a9a9a;
      white-space: nowrap;
    }
    .role-limit-input {
      width: 38px; background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 6px;
      color: #eee; padding: 4px 5px; font-size: 11px; text-align: center;
    }
    .admin-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .admin-tab-btn {
      flex: 1; border: 0; border-radius: 8px; padding: 8px 6px; background: #1c1c1e;
      color: #aaa; cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: .2px;
    }
    .admin-tab-btn:hover { background: #26262a; }
    .admin-tab-btn.active { background: #5865F2; color: #fff; }
    .admin-tab-panel { display: none; }
    .admin-tab-panel.active { display: block; }

    .combat-mgmt-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.06); flex-wrap: wrap;
    }
    .combat-mgmt-row:last-child { border-bottom: 0; }
    .combat-mgmt-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
    .combat-mgmt-name { flex: 1; min-width: 80px; font-size: 12px; color: #ddd; font-weight: 600; }
    .combat-mgmt-usage { font-size: 11px; color: #9a9a9a; white-space: nowrap; }
    .combat-mgmt-reset-btn {
      border: 0; border-radius: 8px; padding: 6px 10px; background: #3a3a3c;
      color: #ddd; cursor: pointer; font-size: 11px; flex-shrink: 0;
    }
    .combat-mgmt-reset-btn:hover { background: #4a4a4c; }
    .combat-global-actions { display: flex; gap: 8px; margin-top: 14px; }
    .combat-global-actions button {
      flex: 1; border: 0; border-radius: 8px; padding: 9px; background: #2b2b2d;
      color: #ddd; cursor: pointer; font-size: 11px; font-weight: 500;
    }
    .combat-global-actions button:hover { background: #38383a; }

    .admin-add-role { display: flex; gap: 6px; margin-top: 10px; }
    .admin-add-role input[type="text"] {
      flex: 1; background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 8px;
      color: #eee; padding: 7px 9px; font-size: 12px;
    }
    .admin-add-role input[type="color"] {
      width: 34px; height: 30px; padding: 2px; border-radius: 8px;
      border: 1px solid #3a3a3c; background: #1c1c1e; cursor: pointer; flex-shrink: 0;
    }
    .admin-add-role button, .admin-assign-row button {
      border: 0; border-radius: 8px; padding: 7px 12px; background: #5865F2;
      color: #fff; cursor: pointer; font-size: 12px; font-weight: 500; flex-shrink: 0;
    }
    .admin-add-role button:hover, .admin-assign-row button:hover { background: #4752c4; }
    .admin-assign-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .admin-assign-row input, .admin-assign-row select {
      background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 8px;
      color: #eee; padding: 7px 9px; font-size: 12px;
    }
    .admin-assign-row input { flex: 1; min-width: 120px; }
    .assigned-users-list {
      margin-top: 10px; display: flex; flex-direction: column; gap: 6px;
      max-height: 140px; overflow-y: auto;
    }
    .assigned-user-row {
      display: flex; align-items: center; gap: 8px; background: #1c1c1e;
      border-radius: 8px; padding: 6px 8px; font-size: 12px;
    }
    .assigned-user-row img { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
    .assigned-user-row .u-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .assigned-user-row .u-role { color: #9a9a9a; font-size: 11px; white-space: nowrap; }
    .assigned-user-row button {
      border: 0; background: rgba(168,58,58,.15); color: #e07070;
      width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-size: 11px; flex-shrink: 0;
    }
    .assigned-user-row button:hover { background: rgba(168,58,58,.3); }
    .admin-empty-hint { color: #777; font-size: 12px; }
    .admin-panel-error {
      margin-top: 12px; padding: 8px 10px; border-radius: 8px;
      background: rgba(168,58,58,.15); border: 1px solid rgba(168,58,58,.4);
      color: #e07070; font-size: 11px; line-height: 1.4;
    }

    .battle-history-modal { width: 360px; }
    .battle-history-body { max-height: 60vh; overflow-y: auto; }
    .battle-history-toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .battle-history-clear-btn {
      border: 0; border-radius: 8px; padding: 6px 10px; font-size: 11px; font-weight: 600;
      background: rgba(168,58,58,.15); color: #e07070; cursor: pointer;
    }
    .battle-history-clear-btn:hover { background: rgba(168,58,58,.3); }
    .battle-history-day-header {
      font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: #9a9a9a;
      margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.06);
    }
    .battle-history-day-header:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
    .battle-history-list { display: flex; flex-direction: column; gap: 10px; }
    .battle-history-item {
      background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 10px;
      padding: 10px 12px;
    }
    .battle-history-item-title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .battle-history-item-desc { font-size: 12px; color: #ccc; line-height: 1.45; white-space: pre-wrap; }
    .battle-history-item-date { font-size: 11px; color: #888; margin-top: 6px; text-align: right; }
    .battle-history-empty { color: #777; font-size: 13px; padding: 6px 0; }

    /* Иконка фракции на квадрате — маленький кружок в углу квадрата. */
    .square-faction-icon {
      position: absolute; top: -8px; right: -8px; width: 16px; height: 16px;
      border-radius: 50%; background: #111; border: 1px solid rgba(255,255,255,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; line-height: 1; box-shadow: 0 2px 4px rgba(0,0,0,.5);
      z-index: 6; pointer-events: none;
    }
    /* Онлайн-таймер обратного отсчёта КД атаки — показывается под квадратом,
       пока он находится на КД (обновляется каждую секунду через JS). */
    .square-cooldown {
      position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%);
      background: rgba(10,10,12,.9); color: #ffb4b4; font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 6px; white-space: nowrap;
      z-index: 6; pointer-events: none; display: none;
      font-variant-numeric: tabular-nums;
    }
    /* Отдельная кнопка "Напасть" прямо на квадрате (по наведению) — не
       требует открытия инфо-панели. Показывается только когда атака
       разрешена (класс enabled добавляется/убирается из JS). */
    .square-quick-attack {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #fff; background: rgba(168,58,58,0); border-radius: 3px;
      opacity: 0; cursor: pointer; transition: opacity .15s ease, background .15s ease;
      z-index: 7;
    }
    .map-square:hover .square-quick-attack.enabled { opacity: 1; background: rgba(168,58,58,.6); }
  </style>
</head>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
  <script>
    const DISCORD_CLIENT_ID = '1553547752389214248';
    const ADMIN_DISCORD_IDS = ['591164513353465856'];
    const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyCm5SLgYYSEaPDWrY0zApMvl1jCHSF_53E',
      authDomain: 'state-control-league.firebaseapp.com',
      databaseURL: 'https://state-control-league-default-rtdb.firebaseio.com/',
      projectId: 'state-control-league'
    };
    firebase.initializeApp(FIREBASE_CONFIG);
    const squaresRef = firebase.database().ref('squares');
    // Записи истории сражений хранятся в узле "battleHistory" — каждая запись:
    // { title, description, date (строка) или timestamp, createdAt }.
    // ВАЖНО: как и с узлами "roles"/"userRoles", в правилах безопасности
    // Firebase Realtime Database должна быть разрешена запись в узел
    // "battleHistory" (например ".read": true, ".write": true для этого
    // пути), иначе кнопка "Напасть" будет молча падать с ошибкой
    // PERMISSION_DENIED и запись в историю не попадёт.
    const battleHistoryRef = firebase.database().ref('battleHistory');
    // ==========================================================

    // ================= РОЛИ И ПРАВА (панель администратора) =================
    // Помимо жёстко заданных владельцев в ADMIN_DISCORD_IDS (у них всегда есть
    // ВСЕ права и они не могут быть понижены), можно создавать гибкие роли с
    // настраиваемыми правами и выдавать их любым пользователям по Discord ID
    // прямо из панели администратора (шестерёнка рядом с ником после входа).
    const rolesRef = firebase.database().ref('roles');
    const userRolesRef = firebase.database().ref('userRoles');
    // Узел с суточным расходом атак/защиты по каждой роли:
    // roleUsage/{roleId}/{dateKey} = { attacks: N, defenses: N }.
    // dateKey — дата по МСК вида "2026-09-28", поэтому счётчик сам
    // "обнуляется" каждый день (просто появляется новый узел с датой).
    const roleUsageRef = firebase.database().ref('roleUsage');
    let rolesData = {};
    let userRolesData = {};
    let roleUsageData = {};
    let currentUser = null;

    // Список фракций, которые можно назначить квадрату в редакторе, и из
    // которых состоят предустановленные роли лидеров/замов.
    const FACTIONS = ['FIB', 'WN', 'SANG', 'SD', 'EMS', 'LSPD'];

    // Иконки фракций — показываются маленьким кружком в углу квадрата,
    // которому назначена соответствующая фракция.
    const FACTION_ICONS = {
      FIB: '🕵️', WN: '💰', SANG: '🩸', SD: '⭐', EMS: '🚑', LSPD: '👮'
    };

    // Задержка на повторную атаку одного и того же квадрата — 1 час.
    // (объявлено рано, до всех live-подписок Firebase, чтобы избежать
    // обращения к константе до её инициализации).
    const ATTACK_COOLDOWN_MS = 60 * 60 * 1000;

    // Дата по московскому времени в формате YYYY-MM-DD — ключ суточного
    // лимита атак/защиты (сбрасывается сам собой в полночь МСК).
    function todayKey() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Moscow', year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(new Date());
      const get = (t) => (parts.find((p) => p.type === t) || {}).value || '';
      return `${get('year')}-${get('month')}-${get('day')}`;
    }

    // Предустановленные роли лидеров/замов фракций — создаются один раз (по
    // фиксированным ключам, чтобы не задублировались) при первом заходе
    // владельца сайта. Дальше их можно только менять (цвет, лимиты и т.д.)
    // через панель администратора — они не пересоздаются повторно.
    const DEFAULT_LEADER_ROLES = {
      fib_leader:  { name: 'FIB LEADER',  color: '#3b82f6', faction: 'FIB',  rank: 'LEADER', icon: '🕵️' },
      fib_dep:     { name: 'FIB DEP',     color: '#93c5fd', faction: 'FIB',  rank: 'DEP',    icon: '🕵️' },
      wn_leader:   { name: 'WN LEADER',   color: '#eab308', faction: 'WN',   rank: 'LEADER', icon: '💰' },
      wn_dep:      { name: 'WN DEP',      color: '#fde68a', faction: 'WN',   rank: 'DEP',    icon: '💰' },
      sang_leader: { name: 'SANG LEADER', color: '#a3324a', faction: 'SANG', rank: 'LEADER', icon: '🩸' },
      sang_dep:    { name: 'SANG DEP',    color: '#e08fa2', faction: 'SANG', rank: 'DEP',    icon: '🩸' },
      sd_leader:   { name: 'SD LEADER',   color: '#8b5cf6', faction: 'SD',   rank: 'LEADER', icon: '⭐' },
      sd_dep:      { name: 'SD DEP',      color: '#c4b5fd', faction: 'SD',   rank: 'DEP',    icon: '⭐' },
      ems_leader:  { name: 'EMS LEADER',  color: '#22c55e', faction: 'EMS',  rank: 'LEADER', icon: '🚑' },
      ems_dep:     { name: 'EMS DEP',     color: '#86efac', faction: 'EMS',  rank: 'DEP',    icon: '🚑' },
      lspd_leader: { name: 'LSPD LEADER', color: '#38bdf8', faction: 'LSPD', rank: 'LEADER', icon: '👮' },
      lspd_dep:    { name: 'LSPD DEP',    color: '#a5e4fb', faction: 'LSPD', rank: 'DEP',    icon: '👮' }
    };

    // Запускается только у владельца сайта (ADMIN_DISCORD_IDS) и только
    // если роль с таким ключом ещё не создана — безопасно вызывать при
    // каждом входе, ничего не перезатирает.
    function seedDefaultLeaderRoles() {
      Object.keys(DEFAULT_LEADER_ROLES).forEach((key) => {
        if (rolesData[key]) return; // уже создана — не трогаем (цвет/лимиты могли поменять вручную)
        rolesRef.child(key).set({
          ...DEFAULT_LEADER_ROLES[key],
          manageSquares: false, deleteSquares: false, manageRoles: false, attackSquares: true,
          attacksPerDay: 2, defensesPerDay: 2
        }).catch(() => {});
      });
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function isOwnerId(id) {
      return ADMIN_DISCORD_IDS.includes(id);
    }

    function getPermissions(user) {
      if (!user) return { manageSquares: false, deleteSquares: false, manageRoles: false, attackSquares: false, owner: false, roleId: null, roleName: null, roleColor: null, roleIcon: null, faction: null, rank: null, attacksPerDay: null, defensesPerDay: null };
      if (isOwnerId(user.id)) return { manageSquares: true, deleteSquares: true, manageRoles: true, attackSquares: true, owner: true, roleId: null, roleName: null, roleColor: null, roleIcon: null, faction: null, rank: null, attacksPerDay: null, defensesPerDay: null };
      const ur = userRolesData[user.id];
      const role = ur && rolesData[ur.roleId];
      return {
        manageSquares: !!(role && role.manageSquares),
        deleteSquares: !!(role && role.deleteSquares),
        manageRoles: !!(role && role.manageRoles),
        attackSquares: !!(role && role.attackSquares),
        owner: false,
        roleId: role ? ur.roleId : null,
        roleName: role ? role.name : null,
        roleColor: role ? (role.color || '#5865F2') : null,
        roleIcon: role ? (role.icon || null) : null,
        faction: role ? (role.faction || null) : null,
        rank: role ? (role.rank || null) : null,
        attacksPerDay: (role && role.attacksPerDay != null) ? Number(role.attacksPerDay) : null,
        defensesPerDay: (role && role.defensesPerDay != null) ? Number(role.defensesPerDay) : null
      };
    }

    // Применяет текущие права к интерфейсу (кнопка квадрата, шестерёнка,
    // возможность двигать/редактировать/удалять квадраты). Вызывается при
    // входе, выходе и при любом live-изменении ролей/назначений в Firebase.
    function applyCurrentPermissions() {
      const perms = getPermissions(currentUser);
      window.isAdmin = perms.manageSquares;
      window.canDeleteSquares = perms.deleteSquares;
      window.canManageRoles = perms.manageRoles;
      window.canAttackSquares = perms.attackSquares;
      window.currentPerms = perms;
      if (!perms.manageSquares && typeof setSquareModeActive === 'function') setSquareModeActive(false);
      if (!perms.manageRoles && typeof closeAdminPanel === 'function') closeAdminPanel();
      if (addSquareBtnEl) addSquareBtnEl.classList.toggle('hidden-btn', !perms.manageSquares);
      const gearBtn = authWidgetEl && authWidgetEl.querySelector('#adminGearBtn');
      if (gearBtn) gearBtn.style.display = perms.manageRoles ? 'flex' : 'none';
      updateRoleBadge(perms);
      if (currentUser && isOwnerId(currentUser.id) && typeof seedDefaultLeaderRoles === 'function') seedDefaultLeaderRoles();
      if (typeof refreshSquaresInteractivity === 'function') refreshSquaresInteractivity();
      if (typeof updateDeleteButtonVisibility === 'function') updateDeleteButtonVisibility();
      if (typeof updateAttackButtonVisibility === 'function') updateAttackButtonVisibility();
      if (typeof updateCombatBadges === 'function') updateCombatBadges();
      // try/catch: при самом раннем вызове (до объявления этих переменных ниже по скрипту) просто пропускаем
      try { updateCooldownTimers(); } catch (e) {}
      try { renderBattleHistory(); } catch (e) {}
      if (adminPanelOpen && typeof renderAdminPanelContent === 'function') renderAdminPanelContent();
      return perms;
    }

    // Показывает читаемую ошибку прямо в панели администратора, если запись
    // в Firebase не удалась (чаще всего — не обновлены правила безопасности
    // для узлов "roles"/"userRoles", см. комментарий в начале файла).
    function showAdminError(err) {
      const el = document.getElementById('adminPanelError');
      if (!el) { console.error(err); return; }
      if (typeof err === 'string') {
        el.textContent = 'Ошибка: ' + err;
      } else {
        const msg = (err && err.message) ? err.message : String(err);
        el.textContent = 'Ошибка сохранения: ' + msg + '. Скорее всего, в правилах Firebase не разрешена запись в узлы "roles"/"userRoles" — см. комментарий в начале файла.';
      }
      el.style.display = 'block';
      clearTimeout(showAdminError._t);
      showAdminError._t = setTimeout(() => { el.style.display = 'none'; }, 9000);
    }

    // Если у пользователя уже есть выданная роль, при входе кэшируем его имя
    // и аватар в userRoles — так в панели администратора видно не голый
    // Discord ID, а реальное имя (узнаём его только когда человек сам зайдёт).
    function cacheUserRoleProfile(user) {
      const ur = userRolesData[user.id];
      if (!ur || isOwnerId(user.id)) return;
      const displayName = user.global_name || user.username;
      if (ur.username !== displayName || ur.avatar !== (user.avatar || null)) {
        userRolesRef.child(user.id).update({ username: displayName, avatar: user.avatar || null });
      }
    }

    rolesRef.on('value', (snap) => {
      rolesData = snap.val() || {};
      if (currentUser) applyCurrentPermissions();
      if (adminPanelOpen) renderAdminPanelContent();
    });
    userRolesRef.on('value', (snap) => {
      userRolesData = snap.val() || {};
      if (currentUser) applyCurrentPermissions();
      if (adminPanelOpen) renderAdminPanelContent();
    });
    roleUsageRef.on('value', (snap) => {
      roleUsageData = snap.val() || {};
      if (typeof updateCombatBadges === 'function') updateCombatBadges();
      if (typeof updateAttackButtonVisibility === 'function') updateAttackButtonVisibility();
      if (adminPanelOpen && typeof renderCombatMgmtList === 'function') renderCombatMgmtList();
    });

    // --- Панель администратора (модальное окно) ---
    let adminPanelOpen = false;
    const adminPanelEl = document.getElementById('adminPanelModal');
    const adminPanelBackdropEl = document.getElementById('adminPanelBackdrop');

    // Переключение вкладок "Управление ролями" / "Атака и защита" внутри
    // панели администратора.
    adminPanelEl.querySelectorAll('.admin-tab-btn').forEach((btn) => {
      btn.onclick = () => {
        adminPanelEl.querySelectorAll('.admin-tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
        const tab = btn.dataset.adminTab;
        document.getElementById('adminTabRoles').classList.toggle('active', tab === 'roles');
        document.getElementById('adminTabCombat').classList.toggle('active', tab === 'combat');
      };
    });

    function openAdminPanel() {
      if (!window.canManageRoles) return;

    // --- Вкладка "Атака и защита" панели администратора: список ролей с

    };
    // ==========================================================================
    // Majestic Wiki map tile pattern:
    // https://cdn-world.majestic-files.net/public/master/wiki/map/black/{z}/{x}/{y}.png
    const layers = {
      black: 'https://cdn-world.majestic-files.net/public/master/wiki/map/black/{z}/{x}/{y}.png',
      satellite: 'https://cdn-world.majestic-files.net/public/master/wiki/map/satellite/{z}/{x}/{y}.jpg'
    };

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: 4,
      maxZoom: 6,
      zoom: 4,
      center: [0, 0],
      zoomControl: false,
      attributionControl: false,
      doubleClickZoom: true,
      scrollWheelZoom: true,
      dragging: true,
      // touchZoom (встроенный pinch-зум Leaflet) отключён намеренно: во время
      // самого жеста Leaflet плавно растягивает CSS-transform'ом всю панель
      // карты (тайлы И маркеры) под пальцами, из-за чего квадраты временно
      // "распухали" прямо в процессе сведения/разведения пальцев — это не
      // лечится настройками zoomAnimation (она гасит анимацию только в
      // момент отпускания). Вместо этого зум по пальцам реализован вручную
      // ниже (см. "Кастомный pinch-zoom"): дискретными шагами через
      // map.setZoomAround(), без промежуточного визуального масштабирования,
      // поэтому размер квадратов остаётся неизменным на всём протяжении жеста.
      touchZoom: false,
      boxZoom: false,
      keyboard: true,
      // zoomAnimation отключена намеренно: во время анимированного зума Leaflet
      // временно масштабирует весь слой карты (включая иконки квадратов) через
      // CSS-transform, из-за чего квадраты визуально "прыгали" в размере при
      // приближении. Без анимации зум происходит мгновенно, но квадраты всегда
      // остаются ровно в заданном пиксельном размере.
      zoomAnimation: false,
      // Доп. страховка от той же проблемы: явно отключаем отдельную анимацию
      // маркеров при зуме (актуально в первую очередь для pinch-zoom на
      // мобильных, где Leaflet может анимировать маркеры отдельно от тайлов).
      markerZoomAnimation: false
    });

    const tileOptions = {
      tileSize: 256,
      minZoom: 4,
      maxZoom: 6,
      noWrap: true,
      keepBuffer: 4,
      updateWhenIdle: false,
      updateWhenZooming: true
    };

    let activeLayer = L.tileLayer(layers.black, tileOptions).addTo(map);

    // --- Автоопределение реального размера карты по сетке тайлов ---
    // Мы не знаем точные размеры исходной карты, поэтому "прощупываем"
    // тайлы на базовом зуме: пробуем грузить картинки по возрастающим
    // индексам X и Y, пока они существуют, и так находим границы сетки.

    function tileExists(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    function tileUrl(template, z, x, y) {
      return template.replace('{z}', z).replace('{x}', x).replace('{y}', y);
    }

    // Экспоненциальный + бинарный поиск последнего существующего индекса
    async function findMaxIndex(makeUrl) {
      if (!(await tileExists(makeUrl(0)))) return -1;
      let lo = 0, hi = 1;
      while (hi < 8192 && (await tileExists(makeUrl(hi)))) {
        lo = hi;
        hi *= 2;
      }
      while (hi - lo > 1) {
        const mid = Math.floor((lo + hi) / 2);
        if (await tileExists(makeUrl(mid))) lo = mid; else hi = mid;
      }
      return lo;
    }

    async function detectExtentAndLockCamera() {
      const baseZoom = map.getMinZoom();
      const maxX = await findMaxIndex(x => tileUrl(layers.black, baseZoom, x, 0));
      const maxY = await findMaxIndex(y => tileUrl(layers.black, baseZoom, 0, y));

      if (maxX < 0 || maxY < 0) {
        // Не удалось определить сетку (например, из-за CORS/сети) —
        // оставляем карту как есть, без жёстких границ.
        return;
      }

      const cols = maxX + 1;
      const rows = maxY + 1;
      const pxWidth = cols * tileOptions.tileSize;
      const pxHeight = rows * tileOptions.tileSize;

      // Переводим пиксельные границы сетки в координаты Leaflet (CRS.Simple)
      const southWest = map.unproject([0, pxHeight], baseZoom);
      const northEast = map.unproject([pxWidth, 0], baseZoom);
      const bounds = L.latLngBounds(southWest, northEast);
      const center = bounds.getCenter();

      map.setMaxBounds(bounds);
      map.options.maxBoundsViscosity = 1.0;

      // Начальный зум на 1 уровень ближе, чем минимальный (меньше чёрных полос по краям)
      const initialZoom = Math.min(baseZoom + 1, map.getMaxZoom());
      map.setView(center, initialZoom);
    }

    detectExtentAndLockCamera();

    // ================= Кастомный pinch-zoom (без "распухания" квадратов) ==
    // Родной touchZoom у Leaflet выключен выше. Здесь он заменён на ручную
    // обработку жеста двумя пальцами: считаем расстояние между пальцами и,
    // как только оно меняется на заданный коэффициент, сразу переключаем
    // зум на соседний уровень через map.setZoomAround() — мгновенно (т.к.
    // zoomAnimation:false), без промежуточного CSS-масштабирования панели.
    // За один длинный жест зум может переключиться на несколько уровней —
    // после каждого шага точка отсчёта расстояния сбрасывается.
    (function setupCustomPinchZoom() {
      const container = map.getContainer();
      let pinchStartDist = null;
      let pinchMid = null;
      const STEP = 1.3; // во сколько раз должно измениться расстояние между пальцами для шага зума

      function dist(t0, t1) {
        const dx = t0.clientX - t1.clientX;
        const dy = t0.clientY - t1.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
      function midPoint(t0, t1) {
        const rect = container.getBoundingClientRect();
        return L.point((t0.clientX + t1.clientX) / 2 - rect.left, (t0.clientY + t1.clientY) / 2 - rect.top);
      }

      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          pinchStartDist = dist(e.touches[0], e.touches[1]);
          pinchMid = midPoint(e.touches[0], e.touches[1]);
        }
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        if (e.touches.length !== 2 || pinchStartDist == null) return;
        e.preventDefault(); // не даём браузеру одновременно скроллить/зумить нативно
        const d = dist(e.touches[0], e.touches[1]);
        const ratio = d / pinchStartDist;
        const latlng = map.containerPointToLatLng(pinchMid);
        if (ratio > STEP) {
          map.setZoomAround(latlng, Math.min(map.getZoom() + 1, map.getMaxZoom()));
          pinchStartDist = d;
          pinchMid = midPoint(e.touches[0], e.touches[1]);
        } else if (ratio < 1 / STEP) {
          map.setZoomAround(latlng, Math.max(map.getZoom() - 1, map.getMinZoom()));
          pinchStartDist = d;
          pinchMid = midPoint(e.touches[0], e.touches[1]);
        }
      }, { passive: false });

      function resetPinch(e) {
        if (e.touches.length < 2) { pinchStartDist = null; pinchMid = null; }
      }
      container.addEventListener('touchend', resetPinch, { passive: true });
      container.addEventListener('touchcancel', resetPinch, { passive: true });
    })();
    // ========================================================================

    // ================= DISCORD LOGIN (логика) =================
    function discordRedirectUri() {
      return window.location.origin + window.location.pathname;
    }

    function discordAuthUrl() {
      const params = new URLSearchParams({
        client_id: DISCORD_CLIENT_ID,
        redirect_uri: discordRedirectUri(),
        response_type: 'token',
        scope: 'identify'
      });
      return `https://discord.com/oauth2/authorize?${params.toString()}`;
    }

    function discordAvatarUrl(user) {
      if (user.avatar) {
        return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64`;
      }
      // Аватар по умолчанию, если пользователь его не поставил
      const fallbackIndex = (user.discriminator && user.discriminator !== '0')
        ? Number(user.discriminator) % 5
        : Number(BigInt(user.id) >> 22n) % 6;
      return `https://cdn.discordapp.com/embed/avatars/${fallbackIndex}.png`;
    }

    async function fetchDiscordUser(token) {
      const res = await fetch('https://discord.com/api/users/@me', {
        headers: { authorization: `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Discord token invalid');
      return res.json();
    }

    let authWidgetEl = null;
    let addSquareBtnEl = null;

          <span class="combat-badge defense hidden" id="combatDefenseBadge" title="Получено защиты сегодня">🛡 0/0</span>

    // Обновляет только бейдж роли рядом с ником, не перерисовывая весь
    // виджет входа. Раньше бейдж считался один раз внутри renderAuthWidget —
    // если роли/назначения из Firebase подгружались уже ПОСЛЕ первого рендера
    // (обычный race condition при входе), бейдж так и оставался пустым до
    // перезахода. Теперь он синхронизируется при каждом обновлении прав.
    function updateRoleBadge(perms) {
      const badgeEl = authWidgetEl && authWidgetEl.querySelector('#userRoleBadge');
      if (!badgeEl) return;
      if (perms.owner) {
        badgeEl.textContent = 'ADMIN';
        badgeEl.style.background = '#5865F2';
        badgeEl.style.display = 'inline-block';
      } else if (perms.roleName) {
        badgeEl.textContent = (perms.roleIcon ? perms.roleIcon + ' ' : '') + perms.roleName;
        badgeEl.style.background = perms.roleColor || '#5865F2';
        badgeEl.style.display = 'inline-block';
      } else {
        badgeEl.textContent = '';
        badgeEl.style.display = 'none';
      }
    }

    // Плашки "⚔ атака" и "🛡 защита" слева от ника: показывают, сколько раз
    // роль текущего пользователя уже атаковала/получала защиту сегодня, из
    // суточного лимита, заданного админом в панели ("0/2"). Если у роли
    // лимит не задан (∞) — плашка скрыта, чтобы не мешать тем, у кого нет
    // ограничений (обычные роли без faction/лимитов).
    function updateCombatBadges() {
      const wrapEl = authWidgetEl && authWidgetEl.querySelector('#combatStatusBadge');
      const attackEl = authWidgetEl && authWidgetEl.querySelector('#combatAttackBadge');
      const defenseEl = authWidgetEl && authWidgetEl.querySelector('#combatDefenseBadge');
      if (!wrapEl || !attackEl || !defenseEl) return;
      const perms = window.currentPerms || {};
      // Берём usage строго по сегодняшней (МСК) дате — так плашка сама
      // "обнуляется" в 00:00 МСК (см. dailyRolloverWatcher ниже, который
      // дёргает этот же пересчёт каждую минуту, включая момент смены даты).
      const dateKey = todayKey();
      const usage = (perms.roleId && roleUsageData[perms.roleId] && roleUsageData[perms.roleId][dateKey]) || {};
      let anyVisible = false;
      if (perms.attacksPerDay != null) {
        const used = usage.attacks || 0;
        attackEl.textContent = `⚔ ${used}/${perms.attacksPerDay}`;
        attackEl.classList.toggle('full', used >= perms.attacksPerDay);
        attackEl.classList.remove('hidden');
        anyVisible = true;
      } else {
        attackEl.classList.add('hidden');
      }
      if (perms.defensesPerDay != null) {
        const used = usage.defenses || 0;
        defenseEl.textContent = `🛡 ${used}/${perms.defensesPerDay}`;
        defenseEl.classList.toggle('full', used >= perms.defensesPerDay);
        defenseEl.classList.remove('hidden');
        anyVisible = true;
      } else {
        defenseEl.classList.add('hidden');
      }
      wrapEl.classList.toggle('hidden', !anyVisible);
    }

    // Раз в минуту пересчитываем плашку и КД-таймеры квадратов — это
    // покрывает два момента, которые событие Firebase само по себе не
    // ловит: наступление полуночи МСК (счётчик "0/1" должен обнулиться без
    // перезахода) и естественное истечение часового КД атаки на квадрате.
    setInterval(() => {
      if (typeof updateCombatBadges === 'function') updateCombatBadges();
      if (adminPanelOpen && typeof renderCombatMgmtList === 'function') renderCombatMgmtList();
    }, 60 * 1000);

    async function initDiscordAuth() {
      // Токен хранится в localStorage (а не sessionStorage), поэтому вход
      // сохраняется между визитами — при следующем открытии сайта (даже
      // после перезапуска браузера) пользователь остаётся авторизован, пока
      // токен, выданный Discord, не истечёт или его не отзовут явным
      // "Выйти". Если мы только что вернулись от Discord — токен лежит в
      // хэше ссылки.
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const tokenFromRedirect = hashParams.get('access_token');
      if (tokenFromRedirect) {
        localStorage.setItem('discord_token', tokenFromRedirect);
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }

      const token = localStorage.getItem('discord_token');
      if (!token) {
        renderAuthWidget(null);
        return;
      }
      try {
        const user = await fetchDiscordUser(token);
        renderAuthWidget(user);
      } catch (e) {
        localStorage.removeItem('discord_token');
        renderAuthWidget(null);
      }
    }

    setTimeout(() => {

    // ================= КВАДРАТЫ (общие метки на карте) =================
    const squareMarkers = {}; // id -> L.marker

    function hexToRgba(hex, alpha) {
      let h = (hex || '#ff5252').replace('#', '');
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const num = parseInt(h, 16) || 0;
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function squareIcon(data, id) {
      const size = (data && data.size) || 20;
      const borderWidth = (data && data.borderWidth != null) ? data.borderWidth : 2;
      const borderColor = (data && data.borderColor) || '#ffffff';
      const opacity = (data && data.opacity != null) ? data.opacity : 1;
      const color = (data && data.color) || '#ff5252';
      // Прозрачность применяется только к заливке (через rgba), а не к обводке —
      // обводка остаётся полностью непрозрачной. Фиксированный пиксельный
      // размер иконки (iconSize) в сочетании с zoomAnimation:false на карте
      // гарантирует, что квадрат не меняет размер при масштабировании.
      const label = (data && data.label) ? escapeHtml(data.label) : '';
      const labelHtml = label ? `<span class="map-square-label">${label}</span>` : '';
      // Иконка фракции — маленький кружок в углу квадрата, если квадрату
      // назначена фракция.
      const factionIcon = (data && data.faction && FACTION_ICONS[data.faction]) || '';
      const factionIconHtml = factionIcon ? `<span class="square-faction-icon" title="${escapeHtml(data.faction)}">${factionIcon}</span>` : '';
      // Плейсхолдер для онлайн-таймера обратного отсчёта КД атаки — сам
      // текст и видимость обновляются отдельно, каждую секунду, функцией
      // updateCooldownTimers(), без пересоздания иконки (см. ниже).
      const cooldownHtml = `<span class="square-cooldown"></span>`;
      // Отдельная кнопка "Напасть" прямо на квадрате (видна по наведению) —
      // работает независимо от инфо-панели, см. quickAttackSquare().
      const quickAttackHtml = `<span class="square-quick-attack" data-quick-attack-id="${escapeHtml(String(id || ''))}" title="Напасть">⚔</span>`;
      return L.divIcon({
        className: '',
        html: `<div class="map-square" style="width:${size}px;height:${size}px;background:${hexToRgba(color, opacity)};border:${borderWidth}px solid ${borderColor};">${labelHtml}${factionIconHtml}${cooldownHtml}${quickAttackHtml}</div>`,
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2]
      });
    }

    let squareModeActive = false; // редактирование/добавление квадратов включается только этой кнопкой
    const squareData = {}; // id -> последние данные с сервера (используется для блокировки, инфо-панели и т.д.)

    // По умолчанию квадрат считается заблокированным (locked !== false), пока
    // админ явно не разблокирует его в редакторе — это защищает от случайных
    // сдвигов при обычных кликах.
    function isSquareLocked(data) {
      return !data || data.locked !== false;
    }

    function upsertSquareMarker(id, data) {
      let marker = squareMarkers[id];
      if (!marker) {
        marker = L.marker([data.lat, data.lng], {
          icon: squareIcon(data, id),
          draggable: !!window.isAdmin && squareModeActive && !isSquareLocked(data),
          bubblingMouseEvents: false // клик по квадрату не должен ещё и "проваливаться" в карту
        }).addTo(map);
        // Подпись квадрата теперь отображается не отдельным всплывающим
        // тултипом Leaflet, а прямо внутри самого квадрата (см. squareIcon) —
        // текст появляется по наведению за счёт CSS (.map-square:hover .map-square-label).

        marker.on('click', () => {
          const current = squareData[id] || {};
          if (window.isAdmin && squareModeActive) {
            // Если этот же квадрат уже открыт в редакторе — не перезаписываем
            // несохранённые изменения его настроек повторным открытием.
            if (editingSquareId === id) return;
            openSquareEditor(id, marker.getLatLng(), current);
          } else {
            openSquareInfo(id, current);
          }
        });

        // Отдельная кнопка "Напасть" прямо на квадрате (по наведению) —
        // работает в обход инфо-панели. Клик по ней не должен также
        // открывать инфо-панель/редактор через marker 'click' выше.
        marker.on('add', () => {
          const el = marker.getElement();
          const btn = el && el.querySelector('.square-quick-attack');
          if (!btn) return;
          L.DomEvent.on(btn, 'click', (e) => {
            L.DomEvent.stopPropagation(e);
            L.DomEvent.preventDefault(e);
            quickAttackSquare(id);
          });
        });

        // Обновляем позицию в реальном времени прямо во время перетаскивания
        // (с небольшим троттлингом), а не только по его завершении — так все
        // остальные посетители видят перемещение квадрата live.
        marker.on('dragstart', () => { marker._localDragging = true; });
        let dragThrottle = null;
        marker.on('drag', () => {
          if (dragThrottle) return;
          dragThrottle = setTimeout(() => { dragThrottle = null; }, 120);
          const pos = marker.getLatLng();
          squaresRef.child(id).update({ lat: pos.lat, lng: pos.lng });
        });
        marker.on('dragend', () => {
          const pos = marker.getLatLng();
          squaresRef.child(id).update({ lat: pos.lat, lng: pos.lng })
            .finally(() => { marker._localDragging = false; });
        });
        squareMarkers[id] = marker;
      } else {
        // ВАЖНО: пока сам пользователь тащит этот квадрат мышью, игнорируем
        // приходящее из Firebase эхо собственных же промежуточных обновлений
        // позиции. Раньше setIcon()/setLatLng() здесь пересоздавали DOM-иконку
        // прямо во время активного перетаскивания и рассинхронизировали её с
        // внутренним обработчиком drag у Leaflet — визуально это выглядело
        // так, будто после разблокировки квадрат "багует" и перестаёт двигаться.
        if (marker._localDragging) return;
        marker.setLatLng([data.lat, data.lng]);
        marker.setIcon(squareIcon(data, id));
        // setIcon() пересоздаёт DOM квадрата, поэтому обработчик клика на
        // кнопке "Напасть" нужно навесить заново.
        const el = marker.getElement();
        const btn = el && el.querySelector('.square-quick-attack');
        if (btn) {
          L.DomEvent.on(btn, 'click', (e) => {
            L.DomEvent.stopPropagation(e);
            L.DomEvent.preventDefault(e);
            quickAttackSquare(id);
          });
        }
      }
    }

    function refreshSquaresInteractivity() {
      const baseCanEdit = !!window.isAdmin && squareModeActive;
      Object.keys(squareMarkers).forEach((id) => {
        const marker = squareMarkers[id];
        const data = squareData[id] || {};
        if (baseCanEdit && !isSquareLocked(data)) marker.dragging.enable();
        else marker.dragging.disable();
      });
    }

    // Онлайн-таймер обратного отсчёта КД атаки прямо на квадрате (вида
    // "58:12") и состояние отдельной кнопки "Напасть" на квадрате —
    // обновляются раз в секунду, без пересоздания иконки (иначе перетаскивание
    // и hover-состояние квадрата будут дёргаться).
    function updateCooldownTimers() {
      const now = Date.now();
      Object.keys(squareMarkers).forEach((id) => {
        const marker = squareMarkers[id];
        const data = squareData[id] || {};
        const el = marker.getElement();
        if (!el) return;
        const cdEl = el.querySelector('.square-cooldown');
        const quickBtn = el.querySelector('.square-quick-attack');
        const remaining = data.lastAttackedAt ? (ATTACK_COOLDOWN_MS - (now - data.lastAttackedAt)) : 0;
        if (cdEl) {
          if (remaining > 0) {
            const totalSec = Math.ceil(remaining / 1000);
            const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
            const ss = String(totalSec % 60).padStart(2, '0');
            cdEl.textContent = `${mm}:${ss}`;
            cdEl.style.display = 'block';
          } else {
            cdEl.style.display = 'none';
          }
        }
        if (quickBtn) {
          const canShow = !!window.canAttackSquares && !!currentUser;
          if (!canShow) {
            quickBtn.style.display = 'none';
            quickBtn.classList.remove('enabled');
          } else {
            quickBtn.style.display = '';
            const block = getAttackBlockReasonFor(id, data);
            quickBtn.classList.toggle('enabled', !block);
            quickBtn.title = block ? block.full : 'Напасть';
          }
        }
      });
    }
    setInterval(updateCooldownTimers, 1000);

    squaresRef.on('child_added', (snap) => {
      squareData[snap.key] = snap.val();
      upsertSquareMarker(snap.key, snap.val());
      refreshSquaresInteractivity();
      updateCooldownTimers();
    });
    squaresRef.on('child_changed', (snap) => {
      squareData[snap.key] = snap.val();
      upsertSquareMarker(snap.key, snap.val());
      refreshSquaresInteractivity();
      updateCooldownTimers();
    });
    squaresRef.on('child_removed', (snap) => {
      delete squareData[snap.key];
      const marker = squareMarkers[snap.key];
      if (marker) { map.removeLayer(marker); delete squareMarkers[snap.key]; }
    });

    // --- Редактор (добавление/изменение/удаление квадрата) ---
    let editingSquareId = null;
    let editingSquareLatLng = null;
    const editorEl = document.getElementById('squareEditor');
    const labelInput = document.getElementById('squareLabelInput');
    const colorInput = document.getElementById('squareColorInput');
    const borderColorInput = document.getElementById('squareBorderColorInput');
    const borderWidthInput = document.getElementById('squareBorderWidthInput');
    const sizeInput = document.getElementById('squareSizeInput');
    const opacityInput = document.getElementById('squareOpacityInput');
    const lockedInput = document.getElementById('squareLockedInput');
    const lockLabelEl = document.getElementById('squareLockLabel');
    const descriptionInput = document.getElementById('squareDescriptionInput');
    const factionInput = document.getElementById('squareFactionInput');
    const deleteBtn = document.getElementById('squareDeleteBtn');
    const previewEl = document.getElementById('squarePreview');

    function updateLockLabel() {
      lockLabelEl.textContent = lockedInput.checked
        ? '🔒 Заблокирован (нельзя двигать)'
        : '🔓 Разблокирован (можно двигать)';
    }
    lockedInput.addEventListener('change', updateLockLabel);

    function updateRangeLabels() {
      document.getElementById('squareBorderWidthVal').textContent = borderWidthInput.value + 'px';
      document.getElementById('squareSizeVal').textContent = sizeInput.value + 'px';
      document.getElementById('squareOpacityVal').textContent = opacityInput.value + '%';
    }

    function updatePreview() {
      const size = Number(sizeInput.value);
      const alpha = Number(opacityInput.value) / 100;
      previewEl.style.width = size + 'px';
      previewEl.style.height = size + 'px';
      previewEl.style.background = hexToRgba(colorInput.value, alpha);
      previewEl.style.border = `${borderWidthInput.value}px solid ${borderColorInput.value}`;
    }

    [borderWidthInput, sizeInput, opacityInput].forEach((el) => {
      el.addEventListener('input', () => { updateRangeLabels(); updatePreview(); });
    });
    [colorInput, borderColorInput].forEach((el) => {
      el.addEventListener('input', updatePreview);
    });

    const editorTitleEl = document.getElementById('squareEditorTitle');

    function openSquareEditor(id, latlng, data) {
      editingSquareId = id;
      editingSquareLatLng = latlng;
      data = data || {};
      labelInput.value = data.label || '';
      colorInput.value = data.color || '#ff5252';
      borderColorInput.value = data.borderColor || '#ffffff';
      borderWidthInput.value = data.borderWidth != null ? data.borderWidth : 2;
      sizeInput.value = data.size || 20;
      opacityInput.value = data.opacity != null ? Math.round(data.opacity * 100) : 100;
      lockedInput.checked = data.locked !== false; // по умолчанию заблокирован
      descriptionInput.value = data.description || '';
      factionInput.value = data.faction || '';
      updateLockLabel();
      updateRangeLabels();
      updatePreview();
      deleteBtn.classList.toggle('hidden', !id || !window.canDeleteSquares);
      editorTitleEl.textContent = id ? 'Редактирование квадрата' : 'Новый квадрат';
      editorEl.classList.add('visible');
      labelInput.focus();
    }

    function closeSquareEditor() {
      editorEl.classList.remove('visible');
      editingSquareId = null;
      editingSquareLatLng = null;
    }

    function updateDeleteButtonVisibility() {
      deleteBtn.classList.toggle('hidden', !editingSquareId || !window.canDeleteSquares);
    }

    // Пока режим добавления/редактирования включён кнопкой "Квадрат", любой
    // клик по свободному месту карты создаёт новый квадрат (можно ставить
    // несколько подряд, не нажимая кнопку заново).
    function handleMapClickForSquare(e) {
      if (!squareModeActive || !window.isAdmin) return;
      openSquareEditor(null, e.latlng, {});
    }

    function setSquareModeActive(active) {
      squareModeActive = active;
      if (addSquareBtnEl) {
        addSquareBtnEl.classList.toggle('active', active);
        addSquareBtnEl.textContent = active ? '✖ Выключить' : '➕ Квадрат';
      }
      map.getContainer().style.cursor = active ? 'crosshair' : '';
      if (active) {
        map.on('click', handleMapClickForSquare);
      } else {
        map.off('click', handleMapClickForSquare);
        closeSquareEditor();
      }
      refreshSquaresInteractivity();
    }

    function toggleSquareMode() {
      setSquareModeActive(!squareModeActive);
    }

    document.getElementById('squareSaveBtn').onclick = () => {
      const payload = {
        label: labelInput.value.trim(),
        color: colorInput.value,
        borderColor: borderColorInput.value,
        borderWidth: Number(borderWidthInput.value),
        size: Number(sizeInput.value),
        opacity: Number(opacityInput.value) / 100,
        locked: lockedInput.checked,
        description: descriptionInput.value.trim(),
        faction: factionInput.value || null,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      };
      if (editingSquareId) {
        squaresRef.child(editingSquareId).update(payload);
      } else if (editingSquareLatLng) {
        squaresRef.push({ lat: editingSquareLatLng.lat, lng: editingSquareLatLng.lng, ...payload });
      }
      closeSquareEditor();
    };
    deleteBtn.onclick = () => {
      if (!window.canDeleteSquares) return;
      if (editingSquareId) squaresRef.child(editingSquareId).remove();
      closeSquareEditor();
    };
    document.getElementById('squareCancelBtn').onclick = closeSquareEditor;
    document.getElementById('squareCloseBtn').onclick = closeSquareEditor;
    // ====================================================================

    // --- Инфо-панель квадрата (показывается всем при клике вне режима редактирования) ---
    const squareInfoEl = document.getElementById('squareInfoModal');
    const squareInfoBackdropEl = document.getElementById('squareInfoBackdrop');
    const squareInfoIconEl = document.getElementById('squareInfoIcon');
    const squareInfoTitleEl = document.getElementById('squareInfoTitle');
    const squareInfoFactionEl = document.getElementById('squareInfoFaction');
    const squareInfoDescEl = document.getElementById('squareInfoDescription');
    const squareInfoFooterEl = document.getElementById('squareInfoFooter');
    const squareAttackBtnEl = document.getElementById('squareAttackBtn');
    const squareInfoErrorEl = document.getElementById('squareInfoError');
    let infoSquareId = null;
    let infoSquareData = null;

    function formatTimestamp(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      // Всегда московское время (МСК, UTC+3), независимо от часового пояса
      // браузера посетителя.
      const parts = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(d);
      const get = (type) => (parts.find((p) => p.type === type) || {}).value || '';
      return `${get('day')}.${get('month')}.${get('year')} ${get('hour')}:${get('minute')} МСК`;
    }

    // Проверяет, можно ли текущему пользователю атаковать открытый в
    // инфо-панели квадрат прямо сейчас, и если нет — возвращает причину
    // (текст для кнопки/ошибки). Возвращает null, если атаковать можно.
    // Используется и для визуального состояния кнопки, и как финальная
    // проверка перед самой отправкой атаки.
    // Универсальная проверка — можно ли атаковать конкретный квадрат прямо
    // сейчас (принимает id/данные явно, а не только через открытую
    // инфо-панель) — используется и модальной кнопкой "Напасть", и отдельной
    // кнопкой атаки прямо на квадрате.
    function getAttackBlockReasonFor(id, data) {
      const perms = window.currentPerms || {};
      data = data || {};
      if (data.lastAttackedAt) {
        const remaining = ATTACK_COOLDOWN_MS - (Date.now() - data.lastAttackedAt);
        if (remaining > 0) {
          const mins = Math.ceil(remaining / 60000);
          return { short: `⏳ Ещё ${mins} мин.`, full: `Этот квадрат недавно атаковали — повторная атака будет доступна через ${mins} мин.` };
        }
      }
      if (perms.faction && data.faction && perms.faction === data.faction) {
        return { short: '⚔ Своя фракция', full: 'Нельзя атаковать квадрат своей же фракции.' };
      }
      if (perms.attacksPerDay != null) {
        const used = (perms.roleId && roleUsageData[perms.roleId] && roleUsageData[perms.roleId][todayKey()] && roleUsageData[perms.roleId][todayKey()].attacks) || 0;
        if (used >= perms.attacksPerDay) {
          return { short: '⚔ Лимит исчерпан', full: `Дневной лимит атак для вашей роли (${perms.attacksPerDay}) уже исчерпан.` };
        }
      }
      return null;
    }

    // Проверка для квадрата, открытого в инфо-панели (модальная кнопка).
    function getAttackBlockReason() {
      return getAttackBlockReasonFor(infoSquareId, infoSquareData);
    }

    // Собственно отправка атаки — общая для модальной кнопки "Напасть" и
    // для отдельной кнопки атаки прямо на квадрате. Возвращает Promise.
    function performAttack(id, data) {
      const perms = window.currentPerms || {};
      const attackerName = currentUser.global_name || currentUser.username;
      const squareLabel = (data && data.label) || 'Без названия';
      const squareFaction = data && data.faction;
      const dateKey = todayKey();
      const tasks = [];

      // 1) Списываем атаку с суточного лимита роли атакующего (общий "запас"
      // на всех, у кого эта роль).
      if (perms.roleId) {
        tasks.push(roleUsageRef.child(perms.roleId).child(dateKey).child('attacks').transaction((cur) => (cur || 0) + 1));
      }
      // 2) Начисляем защиту всем ролям фракции, которой принадлежит квадрат.
      if (squareFaction) {
        Object.keys(rolesData).forEach((rid) => {
          if (rolesData[rid] && rolesData[rid].faction === squareFaction) {
            tasks.push(roleUsageRef.child(rid).child(dateKey).child('defenses').transaction((cur) => (cur || 0) + 1));
          }
        });
      }
      // 3) Ставим квадрату метку времени атаки — включает часовую задержку
      // на повторную атаку этого же квадрата для всех, и запускает онлайн-таймер.
      tasks.push(squaresRef.child(id).update({ lastAttackedAt: firebase.database.ServerValue.TIMESTAMP }));
      // 4) Записываем саму атаку в историю сражений.
      tasks.push(battleHistoryRef.push({
        title: `Атака на «${squareLabel}»`,
        description: `${attackerName} напал(а) на квадрат «${squareLabel}»${squareFaction ? ` (фракция ${squareFaction})` : ''}.`,
        attackerId: currentUser.id,
        attackerName,
        attackerRole: perms.roleName || null,
        squareId: id,
        squareLabel,
        squareFaction: squareFaction || null,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      }));

      return Promise.all(tasks).then((res) => {
        // Подстраховка: сразу пересчитываем плашку атаки/защиты и таймер КД
        // на квадрате, не дожидаясь live-события от Firebase (обычно оно и
        // так приходит почти мгновенно, но так плашка гарантированно
        // покажет актуальное "1/1" сразу после атаки).
        if (typeof updateCombatBadges === 'function') updateCombatBadges();
        if (typeof updateCooldownTimers === 'function') updateCooldownTimers();
        return res;
      });
    }

    // Отдельная кнопка "Напасть" прямо на квадрате (по наведению, в обход
    // инфо-панели). Если атака заблокирована — открываем инфо-панель, чтобы
    // показать причину, вместо того чтобы молча ничего не делать.
    function quickAttackSquare(id) {
      if (!window.canAttackSquares || !currentUser) return;
      const data = squareData[id] || {};
      const block = getAttackBlockReasonFor(id, data);
      if (block) {
        openSquareInfo(id, data);
        squareInfoErrorEl.textContent = block.full;
        squareInfoErrorEl.classList.add('visible');
        return;
      }
      performAttack(id, data).catch((err) => {
        console.error(err);
        openSquareInfo(id, data);
        const msg = (err && err.message) ? err.message : String(err);
        squareInfoErrorEl.textContent = 'Не удалось записать атаку: ' + msg;
        squareInfoErrorEl.classList.add('visible');
      });
    }

    // Показывает/прячет кнопку "Напасть" в уже открытой инфо-панели квадрата
    // в соответствии с текущими правами — вызывается и при открытии панели,
    // и при live-изменении прав/лимитов (выдали/забрали роль с атакой,
    // изменился суточный расход, пока панель открыта).
    function updateAttackButtonVisibility() {
      const canAttackAtAll = !!window.canAttackSquares && !!currentUser && !!infoSquareId;
      squareAttackBtnEl.classList.toggle('hidden', !canAttackAtAll);
      if (!canAttackAtAll) return;
      if (squareAttackBtnEl.classList.contains('sent')) return; // не перетираем "Атака отправлена"
      const block = getAttackBlockReason();
      if (block) {
        squareAttackBtnEl.disabled = true;
        squareAttackBtnEl.classList.add('blocked');
        squareAttackBtnEl.textContent = block.short;
        squareAttackBtnEl.title = block.full;
      } else {
        squareAttackBtnEl.disabled = false;
        squareAttackBtnEl.classList.remove('blocked');
        squareAttackBtnEl.title = '';
        squareAttackBtnEl.textContent = '⚔ Напасть';
      }
    }

    function openSquareInfo(id, data) {
      data = data || {};
      infoSquareId = id;
      infoSquareData = data;
      const opacity = data.opacity != null ? data.opacity : 1;
      squareInfoIconEl.style.background = hexToRgba(data.color || '#ff5252', opacity);
      squareInfoIconEl.style.border = `${data.borderWidth != null ? data.borderWidth : 2}px solid ${data.borderColor || '#ffffff'}`;
      squareInfoTitleEl.textContent = data.label || 'Без названия';
      if (data.faction) {
        const fIcon = FACTION_ICONS[data.faction] ? FACTION_ICONS[data.faction] + ' ' : '';
        squareInfoFactionEl.textContent = `Фракция: ${fIcon}${data.faction}`;
        squareInfoFactionEl.style.display = 'block';
      } else {
        squareInfoFactionEl.style.display = 'none';
      }
      const desc = (data.description || '').trim();
      squareInfoDescEl.textContent = desc || 'Описание отсутствует.';
      squareInfoDescEl.classList.toggle('empty', !desc);
      squareInfoFooterEl.textContent = data.updatedAt ? `Обновлено: ${formatTimestamp(data.updatedAt)}` : '';
      squareInfoErrorEl.classList.remove('visible');
      squareInfoErrorEl.textContent = '';
      squareAttackBtnEl.classList.remove('sent', 'blocked');
      updateAttackButtonVisibility();
      squareInfoEl.classList.add('visible');
      squareInfoBackdropEl.classList.add('visible');
    }

    squareAttackBtnEl.onclick = () => {
      if (!window.canAttackSquares || !currentUser || !infoSquareId) return;
      const block = getAttackBlockReason();
      if (block) {
        squareInfoErrorEl.textContent = block.full;
        squareInfoErrorEl.classList.add('visible');
        return;
      }
      squareAttackBtnEl.disabled = true;
      squareAttackBtnEl.classList.add('sent');
      squareAttackBtnEl.classList.remove('blocked');
      squareAttackBtnEl.textContent = '⚔ Атака отправлена';
      squareInfoErrorEl.classList.remove('visible');

      performAttack(infoSquareId, infoSquareData).then(() => {
        // Успех подтверждаем видимым результатом: кнопка остаётся в
        // состоянии "отправлено" — запись уже появится в "Истории сражений"
        // (список обновляется сам, т.к. подписан на live-изменения
        // battleHistoryRef), а плашка атаки/защиты и таймер КД на квадрате
        // обновятся сразу же (см. performAttack).
      }).catch((err) => {
        console.error(err);
        squareAttackBtnEl.disabled = false;
        squareAttackBtnEl.classList.remove('sent');
        squareAttackBtnEl.textContent = '⚔ Напасть';
        const msg = (err && err.message) ? err.message : String(err);
        squareInfoErrorEl.textContent = 'Не удалось записать атаку: ' + msg + '. Скорее всего, в правилах Firebase не разрешена запись в узлы "battleHistory"/"roleUsage"/"squares" — обновите Realtime Database Rules (аналогично тому, как это было сделано для "roles"/"userRoles").';
        squareInfoErrorEl.classList.add('visible');
      });
    };

    function closeSquareInfo() {
      squareInfoEl.classList.remove('visible');
      squareInfoBackdropEl.classList.remove('visible');
      infoSquareId = null;
      infoSquareData = null;
      squareInfoErrorEl.classList.remove('visible');
    }

    document.getElementById('squareInfoCloseBtn').onclick = closeSquareInfo;
    squareInfoBackdropEl.onclick = closeSquareInfo;
    // ====================================================================

    // --- История сражений (доступна всем, кнопка внизу слева; разделена по
    // дням, у админов есть кнопка очистки) ---
    const battleHistoryEl = document.getElementById('battleHistoryModal');
    const battleHistoryBackdropEl = document.getElementById('battleHistoryBackdrop');
    const battleHistoryListEl = document.getElementById('battleHistoryList');
    const battleHistoryClearBtnEl = document.getElementById('battleHistoryClearBtn');
    let battleHistoryData = {};

    // Ключ дня по МСК (YYYY-MM-DD) для записи истории — используется, чтобы
    // сгруппировать записи по дням в списке.
    function dayKeyOf(ts) {
      if (!ts) return '';
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Moscow', year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(new Date(ts));
      const get = (t) => (parts.find((p) => p.type === t) || {}).value || '';
      return `${get('year')}-${get('month')}-${get('day')}`;
    }
    // Человекочитаемый заголовок дня по МСК ("28 сентября 2026") — для
    // сегодняшнего и вчерашнего дня показываем "Сегодня"/"Вчера".
    function dayHeaderOf(ts) {
      const key = dayKeyOf(ts);
      if (key === todayKey()) return 'Сегодня';
      const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000);
      if (key === dayKeyOf(yesterday.getTime())) return 'Вчера';
      return new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', year: 'numeric'
      }).format(new Date(ts));
    }

    function renderBattleHistory() {
      battleHistoryClearBtnEl.style.display = window.canManageRoles ? 'inline-block' : 'none';

      const ids = Object.keys(battleHistoryData).sort((a, b) => {
        const ta = battleHistoryData[a].createdAt || 0;
        const tb = battleHistoryData[b].createdAt || 0;
        return tb - ta; // сначала новые
      });
      if (!ids.length) {
        battleHistoryListEl.innerHTML = '<div class="battle-history-empty">Пока здесь пусто — сражений ещё не было.</div>';
        return;
      }

      let html = '';
      let lastDayKey = null;
      ids.forEach((id) => {
        const item = battleHistoryData[id] || {};
        const ts = item.createdAt || 0;
        const dk = dayKeyOf(ts);
        if (dk !== lastDayKey) {
          html += `<div class="battle-history-day-header">${escapeHtml(dayHeaderOf(ts))}</div>`;
          lastDayKey = dk;
        }
        const title = escapeHtml(item.title || 'Без названия');
        const desc = escapeHtml(item.description || '');
        const dateStr = item.date ? escapeHtml(item.date) : (ts ? formatTimestamp(ts) : '');
        html += `
          <div class="battle-history-item">
            <div class="battle-history-item-title">${title}</div>
            ${desc ? `<div class="battle-history-item-desc">${desc}</div>` : ''}
            ${dateStr ? `<div class="battle-history-item-date">${dateStr}</div>` : ''}
          </div>
        `;
      });
      battleHistoryListEl.innerHTML = html;
    }

    battleHistoryRef.on('value', (snap) => {
      battleHistoryData = snap.val() || {};
      renderBattleHistory();
    });

    battleHistoryClearBtnEl.onclick = () => {
      if (!window.canManageRoles) return;
      if (!confirm('Очистить всю историю сражений? Это действие необратимо.')) return;
      battleHistoryRef.remove().catch((err) => {
        console.error(err);
        alert('Не удалось очистить историю: ' + ((err && err.message) || err));
      });
    };

    function openBattleHistory() {
      renderBattleHistory();
      battleHistoryEl.classList.add('visible');
      battleHistoryBackdropEl.classList.add('visible');
    }
    function closeBattleHistory() {
      battleHistoryEl.classList.remove('visible');
      battleHistoryBackdropEl.classList.remove('visible');
    }
    document.getElementById('battleHistoryCloseBtn').onclick = closeBattleHistory;
    battleHistoryBackdropEl.onclick = closeBattleHistory;
    // ====================================================================
  </script>
</body>
</html>
